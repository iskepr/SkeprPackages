name: skepr_ui
description: "A modern Flutter UI toolkit featuring customizable inputs, sections with search/sort/filter, Markdown rendering, bottom sheets, and responsive widgets."
version: 0.0.1
homepage: https://github.com/iskepr/SkeprPackages/tree/master/skepr_ui

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  intl: ^0.20.2
  loading_animation_widget: ^1.3.0
  lucide_icons_flutter: ^3.1.17
  markdown: ^7.3.1
  toast_native_dev: ^0.0.9
  url_launcher: ^6.3.2
  vibration: ^3.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true # ~> flutter gen-l10n

